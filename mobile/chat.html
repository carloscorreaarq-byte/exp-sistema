    function onKey(e) { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendText(); } }
    function autoResize(el) { el.style.height = 'auto'; el.style.height = Math.min(el.scrollHeight, 120) + 'px'; }

    // ── Prints ──
    function status(m, c) { const el = document.getElementById('composer-status'); el.textContent = m; el.className = 'composer-status show' + (c ? ' ' + c : ''); }
    function clearStatus(d) { setTimeout(() => { document.getElementById('composer-status').className = 'composer-status'; }, d || 0); }
    async function onPickImage(e) {
      const file = e.target.files && e.target.files[0]; e.target.value = '';
      if (!file || G.uploading) return;
      G.uploading = true; document.getElementById('attach-btn').disabled = true;
      try {
        status('Otimizando print…');
        const cfg = await loadMediaConfig(), opt = await optimizeImage(file, cfg);
        status('Enviando print…');
        const ct = ctxType();
        const path = `${ct}/${G.usuario.auth_id}/${new Date().getFullYear()}/${String(new Date().getMonth()+1).padStart(2,'0')}/${uuid()}.${opt.ext}`;
        const up = await getSB().storage.from(MEDIA_BUCKET).upload(path, opt.blob, { contentType: opt.mimeType, upsert: false });
        if (up.error) throw up.error;
        const rpcName = ct === 'chat_thread_message' ? 'send_chat_thread_message_with_temp_media' : 'send_chat_message_with_temp_media';
        const payload = ct === 'chat_thread_message'
          ? { p_thread_id: G.threadId, p_content: '', p_storage_path: path, p_mime_type: opt.mimeType, p_arquivo_ext: opt.ext, p_size_bytes: opt.blob.size, p_width_px: opt.width, p_height_px: opt.height }
          : { p_channel: G.channel, p_content: '', p_storage_path: path, p_mime_type: opt.mimeType, p_arquivo_ext: opt.ext, p_size_bytes: opt.blob.size, p_width_px: opt.width, p_height_px: opt.height };
        const rpc = await getSB().rpc(rpcName, payload);
        if (rpc.error) { try { await getSB().storage.from(MEDIA_BUCKET).remove([path]); } catch (_) {} throw rpc.error; }
        const saved = Array.isArray(rpc.data) ? rpc.data[0] : rpc.data;
        if (saved && saved.id) {
          upsertMessage(ct === 'chat_thread_message' ? normProj(saved) : saved);
          G.media[saved.id] = { objectUrl: URL.createObjectURL(opt.blob) };
          renderMessages(); scrollBottom(true);
        }
        status('Print enviado ✓'); clearStatus(1600);
      } catch (err) { console.error('[print]', err); status('Falha ao enviar print', 'warn'); clearStatus(2600); }
      finally { G.uploading = false; document.getElementById('attach-btn').disabled = false; }
    }
    async function loadMediaConfig() {
      if (G.mediaConfig) return G.mediaConfig;
      const fb = { ...MEDIA_LIMITS };
      try { const { data } = await getSB().from('plataforma_midia_temporaria_config').select('largura_max_px,tamanho_max_kb,qualidade_upload').eq('id', true).maybeSingle(); G.mediaConfig = { ...fb, ...(data || {}) }; }
      catch (_) { G.mediaConfig = fb; }
      return G.mediaConfig;
    }
    function loadImg(file) { return new Promise((res, rej) => { const img = new Image(), url = URL.createObjectURL(file); img.onload = () => { URL.revokeObjectURL(url); res(img); }; img.onerror = () => { URL.revokeObjectURL(url); rej(new Error('inv')); }; img.src = url; }); }
    function rasterize(img, wmax, q, mime) { return new Promise(res => { const r = img.width > wmax ? wmax/img.width : 1, w = Math.max(1, Math.round(img.width*r)), h = Math.max(1, Math.round(img.height*r)), c = document.createElement('canvas'); c.width = w; c.height = h; c.getContext('2d').drawImage(img, 0, 0, w, h); c.toBlob(b => res({ blob: b, width: w, height: h, mimeType: b ? mime : null }), mime, q); }); }
    async function optimizeImage(file, cfg) {
      const img = await loadImg(file);
      const q = +(cfg.qualidade_upload || MEDIA_LIMITS.qualidade_upload), wmax = +(cfg.largura_max_px || MEDIA_LIMITS.largura_max_px), maxB = +(cfg.tamanho_max_kb || MEDIA_LIMITS.tamanho_max_kb)*1024;
      let r = await rasterize(img, wmax, q, 'image/webp');
      if (!r.blob) r = await rasterize(img, wmax, q, 'image/jpeg');
      if (!r.blob) throw new Error('prep');
      if (r.blob.size > maxB) r = await rasterize(img, Math.min(wmax, 1120), Math.min(q, MEDIA_LIMITS.qualidade_fallback), 'image/jpeg');
      if (!r.blob || r.blob.size > maxB) throw new Error('big');
      return { blob: r.blob, width: r.width, height: r.height, mimeType: r.mimeType, ext: r.mimeType === 'image/webp' ? 'webp' : 'jpg' };
    }
    /* Imagens das mensagens (17/11/2026) — mesmo jeito do chat.js:
       • procura anexo de TODAS as mensagens (antes só as "[print]": foto com legenda não aparecia);
       • consulta em lotes de 60 (300 ids numa consulta só passava do limite e nenhuma imagem vinha);
       • uma chamada gera os links assinados de cada lote, e o <img loading="lazy"> baixa sob demanda;
       • print sem anexo = expirado; falha = "toque para tentar de novo";
       • a mensagem pode chegar antes do anexo: tenta de novo em 1,5 s e 4 s. */
    const SIGNED_URL_EXPIRES = 3600;
    let _mediaSeq = 0;
    async function loadMediaForMessages(forcar) {
      const ct = ctxType(), seq = ++_mediaSeq, sb = getSB();
      const ids = G.messages.map(m => m.id).filter(id => id && (forcar || !(G.media[id] && (G.media[id].objectUrl || G.media[id].expired))));
      if (!ids.length) return;
      const achados = {};
      for (let i = 0; i < ids.length; i += 60) {
        const lote = ids.slice(i, i + 60);
        const { data, error } = await sb.from('gestao_anexos_temporarios')
          .select('contexto_id,storage_path,mime_type,width_px,height_px,marcadores,expires_at')
          .eq('contexto_tipo', ct).in('contexto_id', lote).is('removido_em', null).gt('expires_at', new Date().toISOString());
        if (seq !== _mediaSeq) return;
        if (error) { lote.forEach(id => { if (isImageOnly((G.messages.find(m => m.id === id) || {}).content)) G.media[id] = { failed: true }; }); continue; }
        const rows = (data || []).filter(r => r.storage_path);
        rows.forEach(r => { achados[r.contexto_id] = true; });
        if (rows.length) {
          const sres = await sb.storage.from(MEDIA_BUCKET).createSignedUrls(rows.map(r => r.storage_path), SIGNED_URL_EXPIRES);
          if (seq !== _mediaSeq) return;
          const urlPor = {};
          ((sres && sres.data) || []).forEach(x => { if (x && x.path && x.signedUrl) urlPor[x.path] = x.signedUrl; });
          rows.forEach(r => {
            const url = urlPor[r.storage_path];
            G.media[r.contexto_id] = url
              ? { objectUrl: url, audio: /^audio\//i.test(r.mime_type || ''), w: r.width_px || null, h: r.height_px || null, path: r.storage_path }
              : { failed: true };
          });
        }
        lote.forEach(id => {
          if (achados[id]) return;
          const msg = G.messages.find(m => m.id === id);
          if (msg && (isImageOnly(msg.content) || isAudioOnly(msg.content))) {
            // recém-enviada: o anexo pode ainda não estar gravado
            const idadeMs = Date.now() - new Date(msg.created_at).getTime();
            if (idadeMs < 15000) agendarMidia(); else G.media[id] = { expired: true };
          }
        });
      }
      renderMessages();
    }
    let _midiaTimer = null, _midiaTentativas = 0;
    function agendarMidia() {
      if (_midiaTimer || _midiaTentativas >= 2) return;
      _midiaTimer = setTimeout(() => { _midiaTimer = null; _midiaTentativas++; loadMediaForMessages(); }, _midiaTentativas ? 4000 : 1500);
    }
    function imgFalhou(id) {
      const md = G.media[id]; if (!md || md._retentou) { G.media[id] = { failed: true }; renderMessages(); return; }
      md._retentou = true; tentarMidia(id);
    }
    async function tentarMidia(id) {
      const md = G.media[id] || {};
      G.media[id] = { _retentou: md._retentou };
      renderMessages();
      await loadMediaForMessages(true);
    }

    /* ── Puxar para atualizar (17/11/2026): na lista e na conversa, arrastando para baixo no topo ── */
    function setupPuxarAtualizar() {
      const ptr = document.getElementById('ptr'), pill = ptr.querySelector('.ptr-pill'), txt = document.getElementById('ptr-txt');
      const LIMITE = 70;
      let y0 = null, dy = 0, alvo = null, ocupado = false;
      function scroller() { return G.view === 'conv' ? document.getElementById('messages') : document.getElementById('clist-scroll'); }
      function pintar(d) {
        const p = Math.min(1, d / LIMITE);
        pill.style.opacity = String(p);
        pill.style.transform = `translateY(${Math.min(d, LIMITE + 20) * 0.6 - 30}px)`;
        ptr.classList.toggle('pronto', d >= LIMITE);
        txt.textContent = d >= LIMITE ? 'Solte para atualizar' : 'Puxe para atualizar';
      }
      function soltar() { pill.style.transition = 'opacity .2s, transform .2s'; pill.style.opacity = '0'; pill.style.transform = 'translateY(-40px)'; setTimeout(() => { pill.style.transition = 'opacity .15s'; }, 220); }
      document.addEventListener('touchstart', e => {
        if (ocupado || e.touches.length !== 1) return;
        const el = scroller();
        if (!el || !el.contains(e.target) || el.scrollTop > 0) { y0 = null; return; }
        if (document.querySelector('.sheet.open, .viewer.open')) { y0 = null; return; }
        y0 = e.touches[0].clientY; dy = 0; alvo = el;
      }, { passive: true });
      document.addEventListener('touchmove', e => {
        if (y0 == null || ocupado) return;
        dy = e.touches[0].clientY - y0;
        if (dy <= 0 || alvo.scrollTop > 0) { if (dy < 0) y0 = null; pintar(0); return; }
        if (e.cancelable) e.preventDefault();
        pintar(dy * 0.55);
      }, { passive: false });
      document.addEventListener('touchend', async () => {
        if (y0 == null || ocupado) return;
        const d = dy * 0.55; y0 = null;
        if (d < LIMITE) { soltar(); return; }
        ocupado = true; ptr.classList.remove('pronto'); ptr.classList.add('girando'); txt.textContent = 'Atualizando…';
        pill.style.opacity = '1'; pill.style.transform = 'translateY(12px)';
        try { await atualizarTela(); } catch (_) {}
        ptr.classList.remove('girando'); ocupado = false; soltar();
      });
    }
    async function atualizarTela() {
      if (G.view === 'conv') {
        _midiaTentativas = 0;
        const el = document.getElementById('messages');
        const doFim = el.scrollHeight - el.scrollTop;
        await loadMessagesSilencioso();
        el.scrollTop = el.scrollHeight - doFim;   // mantém a posição de leitura
        await loadMediaForMessages(true);
      } else {
        await loadList();
      }
    }
    /* Recarrega as mensagens sem apagar a tela (usado no puxar e ao voltar para o app) */
    async function loadMessagesSilencioso() {
      const n = Math.min(Math.max(G.messages.length, MSG_LOAD_LIMIT), 300);
      const { data, error } = await _consultaMsgs().order('created_at', { ascending: false }).limit(n);
      if (error) { showToast('Não foi possível atualizar', 'error'); return; }
      G.messages = _norm((data || []).slice().reverse());
      if ((data || []).length === n) G.hasOlder = true;
      renderMessages(); markRead(); loadArquivos(); carregarLeituras();
    }
    /* Voltou para o app depois de um tempo: busca o que chegou (o tempo real pode ter caído com a tela apagada) */
    let _saiuEm = 0;
    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'hidden') { _saiuEm = Date.now(); return; }
      if (!G.usuario || !_saiuEm || Date.now() - _saiuEm < 20000) return;
      _saiuEm = 0;
      if (G.view === 'conv') {
        const perto = nearBottom();
        loadMessagesSilencioso().then(() => { if (perto) scrollBottom(); _midiaTentativas = 0; loadMediaForMessages(); });
      } else loadList();
    });

    // ───────────────────────── REALTIME + PRESENÇA ─────────────────────────
    function subscribe() {
      const sb = getSB();
      G.msgCh = sb.channel('exp:mobile:chat')
        .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'chat_messages' }, payload => {
          const m = payload.new;
          if (G.view === 'conv' && G.channelType !== 'project' && m.channel === G.channel) {
            const wb = nearBottom(); upsertMessage(m); renderMessages();
            if (wb || m.sender_id === G.usuario.auth_id) scrollBottom(true);
            if (isImageOnly(m.content) || isAudioOnly(m.content)) { _midiaTentativas = 0; loadMediaForMessages(); }
            if (document.visibilityState === 'visible') markRead();
          } else if (G.view === 'list') { loadList(); }
        })
        // Edição / exclusão lógica / reações chegam como UPDATE
        .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'chat_messages' }, payload => {
          const m = payload.new;
          if (G.view === 'conv' && G.channelType !== 'project' && m.channel === G.channel) { upsertMessage(m); renderMessages(); }
        })
        .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'chat_thread_messages' }, payload => {
          if (G.view === 'conv' && G.channelType === 'project' && String(payload.new.thread_id) === String(G.threadId)) {
            const wb = nearBottom(); const row = normProj(payload.new); upsertMessage(row); renderMessages();
            if (wb || row.sender_id === G.usuario.auth_id) scrollBottom(true);
            if (isImageOnly(row.content) || isAudioOnly(row.content)) { _midiaTentativas = 0; loadMediaForMessages(); }
            if (document.visibilityState === 'visible') markRead();
          }
        })
        .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'chat_thread_messages' }, payload => {
          if (G.view === 'conv' && G.channelType === 'project' && String(payload.new.thread_id) === String(G.threadId)) { upsertMessage(normProj(payload.new)); renderMessages(); }
        })
        .on('postgres_changes', { event: '*', schema: 'public', table: 'chat_read_status' }, payload => {
          const r = payload.new; if (!r || G.view !== 'conv' || r.channel !== G.channel || !isDynCh(G.channel)) return;
          const i = G.leituras.findIndex(x => x.user_id === r.user_id);
          if (i === -1) G.leituras.push({ user_id: r.user_id, last_read_at: r.last_read_at }); else G.leituras[i].last_read_at = r.last_read_at;
          renderMessages();
        })
        .on('postgres_changes', { event: '*', schema: 'public', table: 'chat_thread_reads' }, payload => {
          const r = payload.new; if (!r || G.view !== 'conv' || G.channelType !== 'project' || String(r.thread_id) !== String(G.threadId)) return;
          const i = G.leituras.findIndex(x => x.user_id === r.user_auth_id);
          if (i === -1) G.leituras.push({ user_id: r.user_auth_id, last_read_at: r.last_read_at }); else G.leituras[i].last_read_at = r.last_read_at;
          renderMessages();
        })
        .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'gestao_anexos_temporarios' }, payload => {
          const row = payload.new;
          if (G.view === 'conv' && (row.contexto_tipo || '').toLowerCase() === ctxType() && G.messages.some(m => m.id === row.contexto_id)) loadMediaForMessages();
        })
        .subscribe();
    }

    function setupPresence() {
      const sb = getSB();
      G.presenceCh = sb.channel('exp:chat:presence');
      G.presenceCh.on('presence', { event: 'sync' }, () => {

        }

    // ── Push contextual ──
    function maybeShowPushBanner() {
      if (!('Notification' in window)) return;
      const banner = document.getElementById('push-banner');
      const text = document.getElementById('push-banner-txt');
      const btn = document.getElementById('push-banner-btn');
      const ctx = window._pushContextReady?.();
      if (ctx && ctx.reason === 'ios-standalone-required') {
        text.innerHTML = '<b>Instale o app no iPhone/iPad</b> e abra pelo ícone da Tela de Início antes de ativar notificações.';
        btn.textContent = 'Entendi';
        btn.onclick = () => dismissPushBanner();
        banner.classList.add('show');
        return;
      }
      if (!('PushManager' in window)) return;
      if (Notification.permission !== 'default') return;
      if (localStorage.getItem('exp-push-dismissed') === '1') return;
      text.innerHTML = '<b>Ative as notificações</b> para receber novas mensagens.';
      btn.textContent = 'Ativar';
      btn.onclick = () => enablePush();
      banner.classList.add('show');
    }
    function dismissPushBanner() { localStorage.setItem('exp-push-dismissed', '1'); document.getElementById('push-banner').classList.remove('show'); }
    async function enablePush() { const ok = await requestPushPermission(); document.getElementById('push-banner').classList.remove('show'); showToast(ok ? 'Notificações ativadas ✓' : 'Não ativadas', ok ? 'success' : 'error'); }

    function openViewer(url) { document.getElementById('viewer-img').src = url; document.getElementById('viewer').classList.add('open'); }
    function closeViewer() { document.getElementById('viewer').classList.remove('open'); }

    // ───────────────────────── INIT ─────────────────────────
    window.addEventListener('DOMContentLoaded', async () => {
      const usuario = await requireAuth('./index.html');
      if (!usuario) return;
      G.usuario = usuario;
      buildBottomNav('chat', isSocio(usuario));

      // Equipe
      const { data: mem } = await getSB().from('usuarios').select('id,auth_id,nome,iniciais,cor,role,avatar_url').eq('ativo', true).order('nome');
      G.members = mem || [];
      G.membersByAuth = {}; G.members.forEach(m => { if (m.auth_id) G.membersByAuth[m.auth_id] = m; });
      montarMencaoRe();
      setupSegurar();

      await loadList();
      openConversationFromRoute();
      subscribe();
      setupPresence();
      setupPuxarAtualizar();
      ensurePushSubscribed();

      document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && G.view === 'conv') markRead(); });
    });

    window.addEventListener('beforeunload', () => { try { G.presenceCh?.untrack(); } catch(e){} G.msgCh?.unsubscribe(); G.presenceCh?.unsubscribe(); });
  </script>

</body>
