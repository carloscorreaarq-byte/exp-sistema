<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#4D865C">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>EXP · Chat</title>
  <link rel="manifest" href="./manifest.json">
  <link rel="apple-touch-icon" href="./assets/icon-192.png">
  <link rel="stylesheet" href="./assets/exp-mobile.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="../shared/nome-curto.js"></script>
  <script src="./assets/exp-mobile-supabase-fallback.js"></script>
  <script>window.EXP_NO_TIMER = true; /* chat tem layout próprio no rodapé */</script>
  <script src="./assets/exp-mobile-core.js"></script>
  <style>
    /* ════ LAYOUT BASE — duas telas (lista / conversa) ════ */
    .chat-wrap {
      position: fixed;
      top: calc(var(--header-h) + var(--safe-t));
      bottom: calc(var(--nav-h) + var(--safe-b));
      left: 0; right: 0;
      display: flex; flex-direction: column; min-height: 0;
    }

    /* ════ TELA DE LISTA (sidebar) ════ */
    #view-list { display: flex; flex-direction: column; min-height: 0; flex: 1; }
    .clist-search {
      flex-shrink: 0;
      display: flex; align-items: center; gap: 8px;
      margin: 10px var(--gap-md);
      padding: 8px 12px;
      background: color-mix(in srgb, var(--m-border) 10%, transparent);
      border: 1px solid color-mix(in srgb, var(--m-border) 28%, transparent);
      border-radius: var(--m-radius-pill);
    }
    .clist-search svg { width: 16px; height: 16px; color: var(--m-text-3); flex-shrink: 0; }
    .clist-search input {
      flex: 1; border: none; background: none; outline: none;
      font-size: var(--mt-callout); color: var(--m-text);
    }
    #clist-scroll { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 0 var(--gap-md) 16px; }
    #clist-scroll::-webkit-scrollbar { width: 0; }

    /* Online agora */
    .pbar { padding: 6px 2px 12px; }
    .pbar-label {
      font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em;
      color: var(--m-text-3); margin-bottom: 8px;
    }
    .pbar-avs { display: flex; gap: 10px; overflow-x: auto; padding-bottom: 2px; }
    .pbar-avs::-webkit-scrollbar { display: none; }
    .pav { flex-shrink: 0; width: 46px; text-align: center; -webkit-tap-highlight-color: transparent; }
    .pav-circle {
      position: relative; width: 46px; height: 46px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-variant-numeric: lining-nums tabular-nums; font-size: 14px; font-weight: 700; color: #fff;
      margin-bottom: 3px;
    }
    .pav-circle img { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; }
    .pav-dot {
      position: absolute; bottom: 0; right: 0; width: 12px; height: 12px; border-radius: 50%;
      border: 2px solid var(--m-bg);
    }
    .pav-dot.online { background: #2D9E6B; }
    .pav-dot.foco { background: #1D4FA0; }
    .pav-dot.ausente { background: var(--ouro); }
    .pav-name {
      font-size: 10px; color: var(--m-text-3);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }

    .clist-sec {
      font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em;
      color: var(--m-text-3); margin: 14px 2px 6px;
      display: flex; align-items: center; justify-content: space-between;
      -webkit-tap-highlight-color: transparent;
    }

    .conv-item {
      display: flex; align-items: center; gap: 12px;
      padding: 10px 6px;
      border-radius: var(--m-radius-card);
      -webkit-tap-highlight-color: transparent;
      transition: background var(--m-transition);
      cursor: pointer;
    }
    .conv-item:active { background: color-mix(in srgb, var(--m-border) 10%, transparent); }
    .conv-av {
      flex-shrink: 0; position: relative;
      width: 44px; height: 44px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-variant-numeric: lining-nums tabular-nums; font-size: 14px; font-weight: 700; color: #fff;
    }
    .conv-av img { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; }
    .conv-av.hash {
      border-radius: 13px; font-size: 18px;
    }
    .conv-av.hash.geral { background: var(--verde-soft); color: var(--verde); }
    .conv-av.hash.bim { background: var(--azul-soft); color: var(--azul); }
    .conv-av.hash.socios { background: var(--ouro-soft); color: var(--ouro); }
    .conv-av.hash.proj { background: var(--azul-soft); color: var(--azul); border-radius: 13px; }
    .conv-av-dot {
      position: absolute; bottom: -1px; right: -1px; width: 12px; height: 12px; border-radius: 50%;
      border: 2px solid var(--m-bg);
    }
    .conv-av-dot.online { background: #2D9E6B; }
    .conv-av-dot.foco { background: #1D4FA0; }
    .conv-av-dot.ausente { background: var(--ouro); }
    .conv-body { flex: 1; min-width: 0; }
    .conv-top { display: flex; align-items: baseline; gap: 6px; }
    .conv-name { flex: 1; min-width: 0; font-size: var(--mt-body); font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .conv-item.unread .conv-name { font-weight: 800; }
    .conv-ts { font-size: 10px; font-variant-numeric: lining-nums tabular-nums; color: var(--m-text-3); flex-shrink: 0; }
    .conv-preview { font-size: var(--mt-caption); color: var(--m-text-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 1px; }
    .conv-item.unread .conv-preview { color: var(--m-text-2); }
    .conv-badge {
      flex-shrink: 0; min-width: 18px; height: 18px; padding: 0 5px;
      border-radius: var(--m-radius-pill); background: var(--verde); color: #fff;
      font-size: 10px; font-weight: 800; font-variant-numeric: lining-nums tabular-nums;
      display: flex; align-items: center; justify-content: center;
    }
    .clist-empty { text-align: center; color: var(--m-text-3); font-size: var(--mt-caption); padding: 30px 16px; }

    /* FAB nova conversa */
    .newconv-fab {
      position: fixed;
      right: var(--gap-md);
      bottom: calc(var(--nav-h) + var(--safe-b) + var(--gap-md));
      width: 52px; height: 52px; border-radius: 50%;
      background: var(--verde); color: #fff;
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 4px 16px color-mix(in srgb, var(--verde) 35%, transparent);
      z-index: 70; border: none;
    }
    .newconv-fab svg { width: 24px; height: 24px; stroke-width: 2.2; }

    /* lista de membros (sheet nova conversa) */
    .member-item { display: flex; align-items: center; gap: 12px; padding: 11px 4px; -webkit-tap-highlight-color: transparent; border-bottom: 1px solid color-mix(in srgb, var(--m-border) 12%, transparent); }
    .member-item:active { background: color-mix(in srgb, var(--m-border) 10%, transparent); }
    .member-av { flex-shrink:0; width:38px; height:38px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-variant-numeric:lining-nums tabular-nums; font-size:13px; font-weight:700; color:#fff; }
    .member-av img { width:100%; height:100%; border-radius:50%; object-fit:cover; }
    .member-name { font-size: var(--mt-body); font-weight: 600; }
    .member-role { font-size: var(--mt-caption); color: var(--m-text-3); }

    /* ════ TELA DE CONVERSA ════ */
    #view-conv { display: none; flex-direction: column; min-height: 0; flex: 1; }
    #view-conv.active { display: flex; }
    #view-list.hidden { display: none; }

    #messages {
      flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch;
      padding: 10px var(--gap-md) 14px; display: flex; flex-direction: column;
    }
    #messages::-webkit-scrollbar { width: 0; }
    /* Puxar para atualizar (17/11/2026): o próprio app cuida do gesto, sem o "quique" do navegador */
    #messages, #clist-scroll { overscroll-behavior-y: contain; }
    .ptr { position: absolute; left: 0; right: 0; top: 0; height: 0; display: flex; justify-content: center; pointer-events: none; z-index: 5; }
    .ptr-pill { margin-top: 6px; display: inline-flex; align-items: center; gap: 7px; padding: 6px 12px; border-radius: 999px;
      background: var(--m-surface, #fff); border: 1px solid color-mix(in srgb, var(--m-border) 30%, transparent);
      box-shadow: 0 4px 14px rgba(0,0,0,.08); font-size: 10px; font-weight: 700; letter-spacing: .5px; text-transform: uppercase;
      color: var(--m-text-3); opacity: 0; transform: translateY(-40px); transition: opacity .15s; }
    .ptr-pill svg { width: 14px; height: 14px; transition: transform .15s; }
    .ptr.pronto .ptr-pill svg { transform: rotate(180deg); }
    .ptr.girando .ptr-pill svg { animation: ptrGira .8s linear infinite; }
    @keyframes ptrGira { to { transform: rotate(360deg); } }
    .media-state.tocar { cursor: pointer; }
    /* Etapas 1 e 2 (17/11/2026) */
    .pav.off .pav-circle { filter: grayscale(1); opacity: .55; }
    .pav.off .pav-name { opacity: .6; }
    .conv-badge.mencao { background: color-mix(in srgb, var(--m-text) 70%, transparent); }
    .clist-sec.novas { color: var(--m-text-2); }
    .novas-sep { align-self: stretch; display: flex; align-items: center; gap: 8px; margin: 12px 0 6px; font-size: 10px; font-weight: 700; letter-spacing: .6px; text-transform: uppercase; color: var(--m-text-3); }
    .novas-sep::before, .novas-sep::after { content: ''; flex: 1; height: 1px; background: color-mix(in srgb, var(--m-border) 40%, transparent); }
    .mais-antigas { align-self: center; font-size: 10px; color: var(--m-text-3); padding: 6px 0; }
    .hdr-st { font-size: 11px; font-weight: 500; color: var(--m-text-3); margin-left: 6px; }
    .msg { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
    .msg.segurando .bubble { transform: scale(.97); transition: transform .12s; }
    .msg-edit { font-size: 9px; color: var(--m-text-3); margin-left: 4px; }
    .bubble .mencao { font-weight: 700; color: var(--verde); }
    .rx-row { display: flex; gap: 4px; margin: 3px 4px 0; }
    .rx-chip { display: inline-flex; align-items: center; gap: 4px; padding: 2px 8px; border-radius: 999px; font-size: 11px; font-weight: 700; color: var(--m-text-2);
      background: var(--m-surface); border: 1px solid color-mix(in srgb, var(--m-border) 30%, transparent); font-variant-numeric: lining-nums tabular-nums; }
    .rx-chip.meu { border-color: color-mix(in srgb, var(--m-text) 45%, transparent); }
    .rx-chip svg { width: 12px; height: 12px; }
    .visto { font-size: 10px; color: var(--m-text-3); margin: 2px 6px 0; align-self: flex-end; }
    .quote { border-left: 3px solid color-mix(in srgb, var(--m-text) 30%, transparent); padding: 2px 8px; margin-bottom: 4px; font-size: 11px; opacity: .85; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .composer-wrap { flex-shrink: 0; position: relative; }
    .compose-bar { display: none; align-items: center; gap: 8px; padding: 7px var(--gap-md); background: var(--m-surface); border-top: 1px solid color-mix(in srgb, var(--m-border) 25%, transparent); font-size: 12px; color: var(--m-text-2); }
    .compose-bar.show { display: flex; }
    .compose-bar .cb-txt { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .compose-bar .cb-lb { font-size: 9px; font-weight: 700; letter-spacing: .6px; text-transform: uppercase; color: var(--m-text-3); display: block; }
    .compose-bar button { width: 28px; height: 28px; display: flex; align-items: center; justify-content: center; color: var(--m-text-3); }
    .compose-bar button svg { width: 16px; height: 16px; stroke-width: 2.2; }
    .digitando { min-height: 16px; padding: 0 var(--gap-md); font-size: 11px; color: var(--m-text-3); font-style: italic; background: transparent; }
    .mencao-dd { position: absolute; left: var(--gap-md); right: var(--gap-md); bottom: 100%; margin-bottom: 6px; max-height: 210px; overflow-y: auto; background: var(--m-surface);
      border: 1px solid color-mix(in srgb, var(--m-border) 30%, transparent); border-radius: 12px; box-shadow: 0 8px 24px rgba(0,0,0,.14); display: none; z-index: 40; }
    .mencao-dd.show { display: block; }
    .mencao-it { display: flex; align-items: center; gap: 10px; padding: 9px 12px; font-size: 14px; color: var(--m-text); }
    .mencao-it + .mencao-it { border-top: 1px solid color-mix(in srgb, var(--m-border) 15%, transparent); }
    .mencao-av { width: 26px; height: 26px; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: #fff; font-size: 10px; font-weight: 700; flex-shrink: 0; }
    .acoes-rx { display: flex; gap: 10px; justify-content: center; padding: 4px 0 12px; }
    .acoes-rx button { width: 52px; height: 52px; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: var(--m-text-2);
      background: color-mix(in srgb, var(--m-border) 12%, transparent); }
    .acoes-rx button.meu { background: color-mix(in srgb, var(--m-text) 14%, transparent); color: var(--m-text); }
    .acoes-rx svg { width: 22px; height: 22px; stroke-width: 2; }
    .acao-it { display: flex; align-items: center; gap: 12px; width: 100%; padding: 13px 4px; font-size: 15px; color: var(--m-text); text-align: left; }
    .acao-it + .acao-it { border-top: 1px solid color-mix(in srgb, var(--m-border) 15%, transparent); }
    .acao-it svg { width: 18px; height: 18px; stroke-width: 2; color: var(--m-text-3); }
    .acao-it.perigo { color: var(--critico, #BC6143); }
    .acao-it.perigo svg { color: currentColor; }
    .acoes-prev { font-size: 12px; color: var(--m-text-3); padding: 0 4px 10px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .chat-loading, .chat-empty { margin: auto; text-align: center; color: var(--m-text-3); font-size: var(--mt-caption); padding: 24px; }

    .date-sep {
      align-self: center; margin: 10px 0 8px;
      font-size: 11px; font-weight: 700; font-variant-numeric: lining-nums tabular-nums; letter-spacing: .3px;
      color: var(--m-text-3); background: color-mix(in srgb, var(--m-border) 14%, transparent);
      padding: 3px 12px; border-radius: var(--m-radius-pill);
    }
    .msg { display: flex; gap: 8px; max-width: 86%; margin-top: 8px; }
    .msg.grouped { margin-top: 2px; }
    .msg.own { align-self: flex-end; flex-direction: row-reverse; }
    .msg-av { flex-shrink: 0; width: 30px; height: 30px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700; color: #fff; font-variant-numeric: lining-nums tabular-nums; margin-top: 14px; }
    .msg.grouped .msg-av { visibility: hidden; height: 0; margin-top: 0; }
    .msg-col { min-width: 0; display: flex; flex-direction: column; }
    .msg.own .msg-col { align-items: flex-end; }
    .msg-head { display: flex; align-items: baseline; gap: 6px; margin: 0 4px 2px; }
    .msg.grouped .msg-head { display: none; }
    .msg-name { font-size: 12px; font-weight: 700; color: var(--m-text-2); }
    .msg-time { font-size: 9px; font-variant-numeric: lining-nums tabular-nums; color: var(--m-text-3); }
    .bubble { padding: 8px 11px; border-radius: 14px; background: var(--m-surface); border: 1px solid color-mix(in srgb, var(--m-border) 20%, transparent); font-size: var(--mt-body); line-height: 1.4; color: var(--m-text); word-break: break-word; white-space: pre-wrap; box-shadow: var(--shadow-card); }
    /* Mesma regra do desktop: o balão da outra pessoa é colorido; o meu é cinza-claro */
    .msg:not(.own) .bubble { background: color-mix(in srgb, var(--verde) 14%, var(--m-surface)); border-color: transparent; }
    .msg.own .bubble { background: color-mix(in srgb, var(--m-text) 7%, var(--m-surface)); border-color: transparent; color: var(--m-text); }
    .msg.own .bubble a { color: var(--verde); }
    .bubble a { color: var(--verde); text-decoration: underline; word-break: break-all; }
    .bubble.media-only { padding: 4px; }
    .bubble-img { display: block; max-width: 100%; width: 230px; max-height: 300px; object-fit: cover; border-radius: 11px; background: color-mix(in srgb, var(--m-border) 14%, transparent); }
    .bubble-cap { margin-top: 6px; padding: 0 5px 2px; }
    .media-state { width: 230px; max-width: 100%; padding: 18px 10px; text-align: center; font-size: 12px; color: var(--m-text-3); border: 1px dashed color-mix(in srgb, var(--m-border) 35%, transparent); border-radius: 11px; }
    .sys-row { align-self: center; margin: 8px 0; }
    .sys-pill { display: inline-flex; align-items: center; gap: 7px; background: var(--verde-soft); color: var(--verde); border-radius: var(--m-radius-pill); padding: 6px 13px; font-size: 12px; font-weight: 600; }
    .sys-pill svg { width: 14px; height: 14px; }

    .composer { flex-shrink: 0; display: flex; align-items: flex-end; gap: 7px; padding: 8px var(--gap-md); background: var(--m-surface); border-top: 1px solid color-mix(in srgb, var(--m-border) 25%, transparent); }
    .composer-btn { flex-shrink: 0; width: 38px; height: 38px; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: var(--m-text-2); background: color-mix(in srgb, var(--m-border) 14%, transparent); }
    .composer-btn svg { width: 20px; height: 20px; stroke-width: 2; }
    .composer-btn.send { background: var(--verde); color: #fff; }
    .composer-btn:disabled { opacity: .45; }
    #chat-input { flex: 1; min-height: 38px; max-height: 120px; resize: none; border: 1px solid color-mix(in srgb, var(--m-border) 30%, transparent); border-radius: 20px; padding: 9px 14px; background: color-mix(in srgb, var(--m-border) 8%, transparent); color: var(--m-text); font-size: var(--mt-callout); line-height: 1.3; outline: none; -webkit-appearance: none; }
    #chat-input:focus { border-color: var(--verde); }

    .composer-status { position: absolute; bottom: calc(var(--nav-h) + var(--safe-b) + 56px); left: 50%; transform: translateX(-50%); background: var(--grafite); color: var(--off); font-size: 12px; font-weight: 600; padding: 6px 14px; border-radius: var(--m-radius-pill); box-shadow: var(--shadow-card); display: none; z-index: 60; }
    .composer-status.show { display: block; }
    .composer-status.warn { background: var(--critico); color: #fff; }

    .viewer { position: fixed; inset: 0; background: rgba(0,0,0,.92); display: none; align-items: center; justify-content: center; z-index: 500; padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom); }
    .viewer.open { display: flex; }
    .viewer img { max-width: 100%; max-height: 100%; object-fit: contain; }
    .viewer-close { position: absolute; top: calc(env(safe-area-inset-top) + 12px); right: 14px; width: 40px; height: 40px; border-radius: 50%; background: rgba(255,255,255,.15); color: #fff; display: flex; align-items: center; justify-content: center; }
    .viewer-close svg { width: 22px; height: 22px; stroke-width: 2.4; }

    .push-banner { display: none; align-items: center; gap: 10px; padding: 10px var(--gap-md); background: var(--verde-soft); border-bottom: 1px solid color-mix(in srgb, var(--verde) 30%, transparent); }
    .push-banner.show { display: flex; }
    .push-banner-ico { flex-shrink: 0; width: 32px; height: 32px; border-radius: 50%; background: var(--verde); color: #fff; display: flex; align-items: center; justify-content: center; }
    .push-banner-ico svg { width: 17px; height: 17px; stroke-width: 2; }
    .push-banner-txt { flex: 1; min-width: 0; font-size: 12px; color: var(--m-text-2); line-height: 1.35; }
    .push-banner-txt b { color: var(--m-text); font-weight: 700; }
    .push-banner-btn { flex-shrink: 0; padding: 7px 13px; border-radius: var(--m-radius-pill); background: var(--verde); color: #fff; font-size: 12px; font-weight: 700; }
    .push-banner-x { flex-shrink: 0; width: 28px; height: 28px; display: flex; align-items: center; justify-content: center; color: var(--m-text-3); }
    .push-banner-x svg { width: 16px; height: 16px; stroke-width: 2.2; }
  </style>
</head>
<body>

  <!-- Header (muda conforme a tela) -->
  <header class="app-header">
    <a href="./app.html" class="header-back" id="hdr-home">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><polyline points="15 18 9 12 15 6"/></svg>
    </a>
    <button class="header-back" id="hdr-back" style="display:none" onclick="showList()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><polyline points="15 18 9 12 15 6"/></svg>
    </button>
    <div class="header-title" id="hdr-title">Chat</div>
  </header>

  <div class="chat-wrap">
    <div class="ptr" id="ptr"><div class="ptr-pill"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg><span id="ptr-txt">Puxe para atualizar</span></div></div>

    <!-- ░░ TELA 1: LISTA ░░ -->
    <div id="view-list">
      <div class="clist-search">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input id="clist-q" type="text" placeholder="Buscar conversa…" oninput="onSearch(this.value)">
      </div>
      <div id="clist-scroll">
        <div class="clist-empty">Carregando…</div>
      </div>
    </div>

    <!-- ░░ TELA 2: CONVERSA ░░ -->
    <div id="view-conv">

          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M12 5v14M5 12h14"/></svg>

          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>

  </div>

  <!-- FAB nova conversa (só na lista) -->
  <button class="newconv-fab" id="newconv-fab" onclick="openNewConv()" title="Nova conversa">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/><line x1="12" y1="7" x2="12" y2="13"/><line x1="9" y1="10" x2="15" y2="10"/></svg>
  </button>

  <nav class="bottom-nav" id="bottom-nav"></nav>

  <!-- Sheet: nova conversa -->
  <div class="sheet-overlay" id="newconv-overlay" onclick="closeSheet('newconv')"></div>
  <div class="sheet" id="newconv-sheet" style="max-height:80dvh">
    <div class="sheet-handle"></div>
    <div class="sheet-title">Nova conversa</div>

  <!-- Sheet: ações da mensagem (segurar o dedo) -->
  <div class="sheet-overlay" id="acoes-overlay" onclick="closeSheet('acoes')"></div>
  <div class="sheet" id="acoes-sheet">
    <div class="sheet-handle"></div>

  <!-- Visualizador de print -->
  <div class="viewer" id="viewer" onclick="closeViewer()">
    <button class="viewer-close" onclick="closeViewer()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
    <img id="viewer-img" src="" alt="">
  </div>

  <script>
    const IMG_SENTINEL = '[print]';
    const MEDIA_BUCKET = 'gestao-anexos-temp';
    const MEDIA_LIMITS = { largura_max_px: 1280, tamanho_max_kb: 500, qualidade_upload: 0.76, qualidade_fallback: 0.70 };
    // Mensagens de texto não expiram mais: sem janela de 72h. Lista usa as 1000 mais
    // recentes; conversa carrega as 300 mais recentes.
    const MSG_LOAD_LIMIT = 50, OLDER_PAGE = 50, UNREAD_FILL_MAX = 200;   // lotes, como no chat.js (17/11/2026)

    let G = {
      usuario: null,
      view: 'list',
      channel: null, channelType: null, threadId: null,
      messages: [], media: {},
      members: [], membersByAuth: {},
      online: {},
      filter: '',
      msgCh: null, threadCh: null, mediaCh: null, presenceCh: null,
      mediaConfig: null, uploading: false,
      readMap: {},
    };

    const escHtml = s => String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
    const firstName = n => (n ? n.split(' ')[0] : '');
    const fmtTime = d => d.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
    const uuid = () => (crypto.randomUUID ? crypto.randomUUID() : 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, c => { const r = Math.random()*16|0, v = c==='x'?r:(r&0x3|0x8); return v.toString(16); }));
    const isImageOnly = c => String(c ?? '').trim() === IMG_SENTINEL;
    const isAudioOnly = c => String(c ?? '').trim() === '[audio]';
    const semAc = v => String(v || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase();
    const UNREAD_WINDOW_MS = 30 * 24 * 60 * 60 * 1000;
    const ICO = {
      like: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M14 9V5a3 3 0 0 0-3-3l-4 9v11h11.28a2 2 0 0 0 2-1.7l1.38-9a2 2 0 0 0-2-2.3zM7 22H4a2 2 0 0 1-2-2v-7a2 2 0 0 1 2-2h3"/></svg>',
      love: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>',
      reply: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 14 4 9 9 4"/><path d="M20 20v-7a4 4 0 0 0-4-4H4"/></svg>',
      copy: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>',
      edit: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg>',
      del: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/></svg>',
    };
    /* Menções: destaca @Nome (nome completo ou primeiro nome) — mesma regra do chat.js */
    let _mencaoRe = null;
    function montarMencaoRe() {
      const toks = [];
      (G.members || []).forEach(m => { if (!m.nome) return; toks.push(m.nome); const f = m.nome.split(' ')[0]; if (f && f !== m.nome) toks.push(f); });
      const uniq = toks.filter((t, i) => toks.indexOf(t) === i).sort((a, b) => b.length - a.length);
      if (!uniq.length) { _mencaoRe = null; return; }
      const alt = uniq.map(t => escHtml(t).replace(/[.*+?^${}()|[\]\\]/g, '\\$&')).join('|');
      try { _mencaoRe = new RegExp('@(?:' + alt + ')(?![\\w\\u00C0-\\u024F])', 'g'); } catch (e) { _mencaoRe = null; }
    }
    function mencionaEu(txt) {
      const n = G.usuario && G.usuario.nome; if (!n || !txt) return false;
      return [n, n.split(' ')[0]].some(t => t && new RegExp('@' + t.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + '(?![\\w\\u00C0-\\u024F])', 'i').test(txt));
    }
    function fmtTexto(txt) {
      let h = escHtml(txt);
      if (_mencaoRe) h = h.replace(_mencaoRe, '<span class="mencao">$&</span>');
      return h.replace(/(https?:\/\/[^\s<]+)/g, '<a href="$1" target="_blank" rel="noopener">$1</a>');
    }
    function iniciaNome(nome, q) {
      const nn = semAc(nome).trim(), nq = semAc(q).trim();
      if (!nq) return true;
      return nn.indexOf(nq) === 0 || nn.split(/[\s.'-]+/).some(w => w.indexOf(nq) === 0);
    }
    const isAnnot = c => /^\[anotacoes:/.test(String(c ?? '').trim());
    const dmChannel = (a, b) => 'dm:' + [a, b].sort().join(':');
    const isProjectCh = ch => ch && ch.startsWith('project:');
    const ctxType = () => (G.channelType === 'project' ? 'chat_thread_message' : 'chat_message');
    const chatRouteParams = () => new URLSearchParams(window.location.search);

    function syncChatRoute(params = {}) {
      const url = new URL(window.location.href);
      url.searchParams.delete('channel');
      url.searchParams.delete('thread');
      if (params.channel) url.searchParams.set('channel', params.channel);
      if (params.thread) url.searchParams.set('thread', params.thread);
      window.history.replaceState({}, '', url);
    }

    function fmtDateSep(d) {
      const today = new Date(), yest = new Date(today); yest.setDate(yest.getDate()-1);
      if (d.toDateString() === today.toDateString()) return 'Hoje';
      if (d.toDateString() === yest.toDateString()) return 'Ontem';
      return d.toLocaleDateString('pt-BR', { day: '2-digit', month: 'long' });
    }
    function fmtConvTs(d) {
      const today = new Date();
      if (d.toDateString() === today.toDateString()) return fmtTime(d);
      const y = new Date(today); y.setDate(y.getDate()-1);
      if (d.toDateString() === y.toDateString()) return 'Ontem';
      return d.toLocaleDateString('pt-BR', { day: '2-digit', month: '2-digit' });
    }
    function linkify(text) { return escHtml(text).replace(/(https?:\/\/[^\s<]+)/g, '<a href="$1" target="_blank" rel="noopener">$1</a>'); }
    function previewOf(content) {
      const r = String(content ?? '').trim();
      if (isImageOnly(r)) return 'Imagem';
      if (isAudioOnly(r)) return 'Áudio';
      if (r === '[arquivo]') return 'Arquivo';
      if (isAnnot(r)) return 'Anotou um print';
      return r.replace(/\n/g, ' ');
    }

    // ───────────────────────── LISTA ─────────────────────────
    async function loadList() {
      const sb = getSB(), uid = G.usuario.auth_id;
      const since = new Date(Date.now() - UNREAD_WINDOW_MS).toISOString();
      const fixos = ['general', 'bim'].concat(isSocio(G.usuario) ? ['socios'] : []);
      /* Mesmas consultas do chat.js: só a janela de apuração (30 dias) em vez das 1000 últimas de todas as conversas */
      const [msgsRes, readsRes, threadsRes] = await Promise.all([
        sb.from('chat_messages').select('channel,sender_id,created_at,content').gte('created_at', since).order('created_at', { ascending: false }),
        sb.from('chat_read_status').select('channel,last_read_at').eq('user_id', uid),
        sb.from('chat_threads').select('id,title,last_message_at').eq('type', 'project').is('archived_at', null).order('last_message_at', { ascending: false, nullsFirst: false }),
      ]);
      const msgs = msgsRes.data || [];
      G.readMap = {}; (readsRes.data || []).forEach(r => { G.readMap[r.channel] = r.last_read_at; });

      // Última mensagem de cada conversa (RPC chat_my_conversations); sem ela, usa a janela
      let heads = msgs;
      try {
        const hr = await sb.rpc('chat_my_conversations');
        if (!hr.error && hr.data) heads = hr.data
          .map(m => m.deleted_at ? { ...m, content: 'Mensagem apagada' } : m)
          .sort((a, b) => new Date(b.created_at || 0) - new Date(a.created_at || 0));
      } catch (e) {}

      try {
        const [cn, cm] = await Promise.all([
          sb.from('chat_channels').select('channel,name,created_at'),
          sb.from('chat_channel_members').select('channel,auth_id,removed_at'),
        ]);
        G.chanNames = {}; (cn.data || []).forEach(r => { if (r.name) G.chanNames[r.channel] = r.name; });
        G.groupMembers = {};
        (cm.data || []).forEach(r => { (G.groupMembers[r.channel] = G.groupMembers[r.channel] || []); if (!r.removed_at) G.groupMembers[r.channel].push(r.auth_id); });
        G.chanRows = cn.data || [];
      } catch (e) { G.chanNames = G.chanNames || {}; G.groupMembers = G.groupMembers || {}; G.chanRows = []; }

      const dmSeen = {}, dms = [];
      heads.forEach(m => {
        if (!isDynCh(m.channel) || !chHasMe(m.channel)) return;
        if (!dmSeen[m.channel]) { dmSeen[m.channel] = true; dms.push(m); }
      });
      (G.chanRows || []).forEach(r => {
        if (!isDynCh(r.channel) || !chHasMe(r.channel) || dmSeen[r.channel]) return;
        dmSeen[r.channel] = true; dms.push({ channel: r.channel, content: 'Nova conversa', created_at: r.created_at, sender_id: null });
      });
      dms.sort((a, b) => new Date(b.created_at || 0) - new Date(a.created_at || 0));

      // Não lidas e menções (DMs e grupos pela janela; canais fixos com contagem exata)
      const unread = {}, mencao = {};
      msgs.forEach(m => {
        if (m.sender_id === uid) return;
        const lr = G.readMap[m.channel] || since;
        if (m.created_at <= lr) return;
        if (mencionaEu(m.content)) mencao[m.channel] = true;
        unread[m.channel] = (unread[m.channel] || 0) + 1;
      });
      await Promise.all(fixos.map(async ch => {
        const r = await sb.from('chat_messages').select('*', { count: 'exact', head: true }).eq('channel', ch).gt('created_at', G.readMap[ch] || since).neq('sender_id', uid);
        if (!r.error) unread[ch] = r.count || 0;
      }));

      // Projetos: última mensagem, o que li e não lidas (3 consultas fixas, como no chat.js)
      const threads = threadsRes.data || [];
      G.projects = threads.map(t => ({ id: t.id, title: t.title || 'Projeto', last_message_at: t.last_message_at }));
      G.projReads = {};
      if (threads.length) {
        const ids = threads.map(t => t.id);
        try {
          const [ult, lidos, outros] = await Promise.all([
            sb.from('chat_thread_messages').select('thread_id,content,created_at,sender_auth_id').in('thread_id', ids).order('created_at', { ascending: false }).limit(ids.length * 3),
            sb.from('chat_thread_reads').select('thread_id,last_read_at').eq('user_auth_id', uid).in('thread_id', ids),
            sb.from('chat_thread_messages').select('thread_id,created_at,content').in('thread_id', ids).neq('sender_auth_id', uid).order('created_at', { ascending: false }).limit(500),
          ]);
          const lastMsg = {}; (ult.data || []).forEach(m => { if (!lastMsg[m.thread_id]) lastMsg[m.thread_id] = m; });
          (lidos.data || []).forEach(r => { G.projReads[r.thread_id] = r.last_read_at; });
          (outros.data || []).forEach(m => {
            const lr = G.projReads[m.thread_id] || since;
            if (m.created_at <= lr) return;
            const ch = 'project:' + m.thread_id;
            unread[ch] = (unread[ch] || 0) + 1;
            if (mencionaEu(m.content)) mencao[ch] = true;
          });
          G.projects.forEach(p => { const lm = lastMsg[p.id]; if (lm) { p.last = lm; p.last_message_at = lm.created_at; } });
        } catch (e) {}
      }

      renderList(heads, dms, ch => unread[ch] || 0, ch => !!mencao[ch]);
    }

    function avatarHtml(cls, bg, content, dotStatus) {
      const dot = dotStatus ? `<span class="conv-av-dot ${dotStatus}"></span>` : '';
      return `<div class="conv-av ${cls}" style="${bg ? 'background:' + bg : ''}">${content}${dot}</div>`;
    }

    function convRow(channel, avHtml, name, preview, ts, unread, mencao) {
      return `<div class="conv-item ${unread > 0 ? 'unread' : ''}" onclick="openChannelFromList('${channel.replace(/'/g, "\\'")}')">
        ${avHtml}
        <div class="conv-body">
          <div class="conv-top"><span class="conv-name">${escHtml(name)}</span>${ts ? `<span class="conv-ts">${ts}</span>` : ''}</div>
          <div class="conv-preview">${escHtml(preview || '')}</div>
        </div>
        ${unread > 0 ? `<span class="conv-badge${mencao ? ' mencao' : ''}">${mencao ? '@ ' : ''}${unread > 99 ? '99+' : unread}</span>` : ''}
      </div>`;
    }

    // ── Conversas dinâmicas (dm: / group:) — participantes e rótulo ──
    function isDynCh(ch) { return !!ch && (ch.startsWith('dm:') || ch.startsWith('group:')); }
    function chUids(ch) { return (G.groupMembers && G.groupMembers[ch]) ? G.groupMembers[ch].slice() : ch.replace(/^dm:|^group:/, '').split(':').filter(Boolean); }
    function chHasMe(ch) { return chUids(ch).indexOf(G.usuario.auth_id) !== -1; }
    function convLabel(ch, fallback) {
      if (G.chanNames && G.chanNames[ch]) return G.chanNames[ch];
      const others = chUids(ch).filter(u => u !== G.usuario.auth_id).map(u => G.membersByAuth[u]).filter(Boolean);
      if (ch.startsWith('group:')) return others.length ? others.map(m => firstName(m.nome)).join(', ') : 'Grupo';
      return firstName((others[0] && others[0].nome) || fallback || 'Conversa');
    }
    function convSearchText(ch) {
      return [convLabel(ch)].concat(chUids(ch).map(u => (G.membersByAuth[u] || {}).nome || '')).join(' ').toLowerCase();
    }

    function renderList(msgs, dms, unreadOf, mencaoOf) {
      const uid = G.usuario.auth_id, q = semAc(G.filter || '').trim();
      mencaoOf = mencaoOf || (() => false);
      let html = '';

      // Equipe: todos, online primeiro; quem está offline fica em cinza (igual ao chat.js)
      if (!q) {
        const pessoas = (G.members || []).filter(m => m.auth_id && m.auth_id !== uid).map(m => {
          const p = G.online[m.auth_id];
          return { uid: m.auth_id, nome: m.nome || '', iniciais: (m.iniciais || (m.nome || '?').substring(0, 2)).toUpperCase(), cor: m.cor || 'var(--verde)', avatar: m.avatar_url || null, status: p ? (p.status || 'online') : '' };
        }).sort((a, b) => (b.status ? 1 : 0) - (a.status ? 1 : 0) || a.nome.localeCompare(b.nome));
        const nOn = pessoas.filter(o => o.status).length;
        if (pessoas.length) {
          html += `<div class="pbar"><div class="pbar-label">Equipe${nOn ? ' · ' + nOn + ' online' : ''}</div><div class="pbar-avs">` +
            pessoas.map(o => `<div class="pav${o.status ? '' : ' off'}" onclick="openDMWith('${o.uid}')">
              <div class="pav-circle" style="background:${o.cor}">${o.avatar ? `<img src="${escHtml(o.avatar)}">` : escHtml(o.iniciais)}${o.status ? `<span class="pav-dot ${o.status}"></span>` : ''}</div>
              <div class="pav-name">${escHtml(firstName(o.nome))}</div>
            </div>`).join('') + `</div></div>`;
        }
      }

      // Linhas de cada seção (com hora crua para ordenar o bloco "Novas conversas")
      const rows = [];
      const lastOf = ch => msgs.find(m => m.channel === ch);
      const canal = (ch, cls, nome, vazio, busca) => {
        if (q && !busca.some(b => semAc(b).includes(q))) return;
        const lm = lastOf(ch);
        rows.push({ sec: 'Canais', ch, t: lm ? lm.created_at : '', html: convRow(ch, avatarHtml('hash ' + cls, '', '#'), nome, lm ? `${firstName(lm.sender_name || (G.membersByAuth[lm.sender_id] || {}).nome || '')}: ${previewOf(lm.content)}` : vazio, lm ? fmtConvTs(new Date(lm.created_at)) : '', unreadOf(ch), mencaoOf(ch)) });
      };
      canal('general', 'geral', '# geral', 'Toda a equipe', ['geral']);
      canal('bim', 'bim', '# BIM', 'Toda a equipe', ['bim']);
      if (isSocio(G.usuario)) canal('socios', 'socios', '# sócios', 'Canal privado', ['socios']);

      dms.forEach(dm => {
        const isGroup = dm.channel.startsWith('group:');
        const other = chUids(dm.channel).find(p => p !== uid);
        const m = (!isGroup && G.membersByAuth[other]) || {};
        const name = convLabel(dm.channel, dm.sender_name);
        if (q && !semAc(convSearchText(dm.channel)).includes(q)) return;
        const pres = isGroup ? null : G.online[other];
        const ini = isGroup || (G.chanNames && G.chanNames[dm.channel])
          ? name.split(/\s+/).slice(0, 2).map(t => t.charAt(0).toUpperCase()).join('')
          : (m.iniciais || (m.nome || '?').substring(0, 2)).toUpperCase();
        const av = avatarHtml('', m.cor || dm.sender_cor || 'var(--verde)', (!isGroup && m.avatar_url) ? `<img src="${escHtml(m.avatar_url)}">` : escHtml(ini), pres ? pres.status : '');
        rows.push({ sec: 'Conversas', ch: dm.channel, t: dm.created_at || '', html: convRow(dm.channel, av, name, `${dm.sender_id === uid ? 'Você: ' : ''}${previewOf(dm.content)}`, dm.created_at ? fmtConvTs(new Date(dm.created_at)) : '', unreadOf(dm.channel), mencaoOf(dm.channel)) });
      });

      (G.projects || []).forEach(p => {
        if (q && !semAc(p.title).includes(q)) return;
        const ch = 'project:' + p.id;
        const lm = p.last;
        const prev = lm ? `${lm.sender_auth_id === uid ? 'Você' : firstName((G.membersByAuth[lm.sender_auth_id] || {}).nome || '')}: ${previewOf(lm.content)}` : 'Chat do projeto';
        rows.push({ sec: 'Projetos', ch, t: p.last_message_at || '', html: convRow(ch, avatarHtml('hash proj', '', p.title.substring(0, 2).toUpperCase()), p.title, prev, p.last_message_at ? fmtConvTs(new Date(p.last_message_at)) : '', unreadOf(ch), mencaoOf(ch)) });
      });

      // "Novas conversas" no topo: tudo que tem não lida, da mais recente para a mais antiga
      const novas = rows.filter(r => unreadOf(r.ch) > 0).sort((a, b) => String(b.t).localeCompare(String(a.t)));
      if (novas.length) html += `<div class="clist-sec novas">Novas conversas</div>` + novas.map(r => r.html).join('');
      ['Canais', 'Conversas', 'Projetos'].forEach(sec => {
        const it = rows.filter(r => r.sec === sec && !(unreadOf(r.ch) > 0));
        if (it.length) html += `<div class="clist-sec">${sec}</div>` + it.map(r => r.html).join('');
      });

      if (!html) html = `<div class="clist-empty">Nenhuma conversa.<br>Toque no botão para iniciar.</div>`;
      document.getElementById('clist-scroll').innerHTML = html;
    }

    function onSearch(v) { G.filter = v; loadList(); }

    // ───────────────────────── NAVEGAÇÃO ENTRE TELAS ─────────────────────────
    function showList() {
      G.view = 'list';
      syncChatRoute();
      document.getElementById('view-list').classList.remove('hidden');
      document.getElementById('view-conv').classList.remove('active');
      document.getElementById('hdr-back').style.display = 'none';
      document.getElementById('hdr-home').style.display = '';
      document.getElementById('newconv-fab').style.display = '';
      document.getElementById('hdr-title').textContent = 'Chat';
      cancelarBarra(true); fecharMencoes(); entrarDigitando(null);
      loadList();
    }

    function openChannelFromList(channel) {
      let type = 'team', label = channel, threadId = null;
      if (channel === 'general') label = '# geral';
      else if (channel === 'bim') label = '# BIM';
      else if (channel === 'socios') label = '# sócios';
      else if (channel.startsWith('dm:') || channel.startsWith('group:')) {
        type = 'dm';
        label = convLabel(channel);
      } else if (channel.startsWith('project:')) {
        type = 'project'; threadId = channel.replace('project:','');
        const p = (G.projects || []).find(x => String(x.id) === String(threadId));
        label = p ? p.title : 'Projeto';
      }
      openConversation(channel, type, label, threadId);
    }

    function openDMWith(authId) {
      if (!authId || authId === G.usuario.auth_id) return;
      const m = G.membersByAuth[authId] || {};
      closeSheet('newconv');
      openConversation(dmChannel(G.usuario.auth_id, authId), 'dm', firstName(m.nome || 'Conversa'), null);
    }

    function openConversation(channel, type, label, threadId) {
      G.view = 'conv'; G.channel = channel; G.channelType = type; G.threadId = threadId;
      syncChatRoute({
        channel: type === 'project' ? null : channel,
        thread: type === 'project' ? threadId : null,
      });
      G.messages = []; G.media = {}; _midiaTentativas = 0; _mediaSeq++;
      document.getElementById('view-list').classList.add('hidden');
      document.getElementById('view-conv').classList.add('active');
      document.getElementById('hdr-home').style.display = 'none';
      document.getElementById('hdr-back').style.display = '';
      document.getElementById('newconv-fab').style.display = 'none';
      G.label = label;
      pintarTopo();
      document.getElementById('messages').innerHTML = `<div class="chat-loading">Carregando…</div>`;
      // até onde eu tinha lido (antes de marcar como lida) → linha "Novas mensagens"
      G.lidoAte = type === 'project' ? ((G.projReads || {})[threadId] || null) : ((G.readMap || {})[channel] || null);
      G.hasOlder = false; G.carregandoAntigas = false; G.leituras = [];
      cancelarBarra(true);
      maybeShowPushBanner();
      entrarDigitando(channel);
      carregarLeituras();
      loadMessages();
    }

    function openConversationFromRoute() {
      const params = chatRouteParams();
      const threadId = params.get('thread');
      const channel = params.get('channel');
      if (threadId) {
        openChannelFromList('project:' + threadId);
        return true;
      }
      if (channel) {
        openChannelFromList(channel);
        return true;
      }
      return false;
    }

    // ───────────────────────── CONVERSA ─────────────────────────
    function nearBottom() { const el = document.getElementById('messages'); return el.scrollHeight - el.scrollTop - el.clientHeight < 120; }
    function scrollBottom(s) { const el = document.getElementById('messages'); el.scrollTo({ top: el.scrollHeight, behavior: s ? 'smooth' : 'auto' }); }

    function normProj(m) {
      return { id: m.id, channel: 'project:' + m.thread_id, thread_id: m.thread_id, sender_id: m.sender_auth_id, sender_name: (window.expNomeCurto || String)(m.sender_nome || ''), sender_iniciais: m.sender_iniciais, sender_cor: m.sender_cor, content: m.content, created_at: m.created_at, reply_to: m.reply_to || null, reactions: m.reactions || null, editado_em: m.editado_em || null, deleted_at: m.deleted_at || null };
    }

    function _consultaMsgs() {
      const sb = getSB();
      return G.channelType === 'project'
        ? sb.from('chat_thread_messages').select('*').eq('thread_id', G.threadId)
        : sb.from('chat_messages').select('*').eq('channel', G.channel);
    }
    const _norm = rows => G.channelType === 'project' ? rows.map(normProj) : rows;
    async function loadMessages() {
      const ch = G.channel;
      const { data, error } = await _consultaMsgs().order('created_at', { ascending: false }).limit(MSG_LOAD_LIMIT);
      if (ch !== G.channel) return;
      if (error) { document.getElementById('messages').innerHTML = `<div class="chat-empty">Erro ao carregar.</div>`; return; }
      G.messages = _norm((data || []).slice().reverse());
      G.hasOlder = (data || []).length === MSG_LOAD_LIMIT;
      // muitas não lidas: completa até a linha "Novas mensagens" (teto de 200)
      while (G.hasOlder && G.lidoAte && G.messages.length < UNREAD_FILL_MAX && G.messages[0] && G.messages[0].created_at > G.lidoAte) {
        const r = await _consultaMsgs().lt('created_at', G.messages[0].created_at).order('created_at', { ascending: false }).limit(OLDER_PAGE);
        if (ch !== G.channel || r.error) break;
        G.messages = _norm((r.data || []).slice().reverse()).concat(G.messages);
        G.hasOlder = (r.data || []).length === OLDER_PAGE;
      }
      renderMessages(); ancorarAbertura(); markRead(); loadMediaForMessages(); loadArquivos();
    }
    /* Abre na linha "Novas mensagens" ou no fim; reajusta enquanto as imagens carregam (3 s) */
    let _ancoraAte = 0;
    function ancorarAbertura() { _ancoraAte = Date.now() + 3000; reancorar(); }
    function reancorar() {
      if (Date.now() > _ancoraAte) return;
      const el = document.getElementById('messages'), sep = el.querySelector('.novas-sep');
      if (sep) el.scrollTop = Math.max(0, sep.offsetTop - 12); else el.scrollTop = el.scrollHeight;
    }
    async function carregarAntigas() {
      if (!G.hasOlder || G.carregandoAntigas || !G.messages.length) return;
      G.carregandoAntigas = true;
      const ch = G.channel, el = document.getElementById('messages');
      const r = await _consultaMsgs().lt('created_at', G.messages[0].created_at).order('created_at', { ascending: false }).limit(OLDER_PAGE);
      G.carregandoAntigas = false;
      if (ch !== G.channel || r.error) return;
      const antes = el.scrollHeight - el.scrollTop;
      G.messages = _norm((r.data || []).slice().reverse()).concat(G.messages);
      G.hasOlder = (r.data || []).length === OLDER_PAGE;
      renderMessages();
      el.scrollTop = el.scrollHeight - antes;   // mantém o que estava na tela
      loadMediaForMessages(); loadArquivos();
    }

    // Documentos anexados (bucket chat-arquivos, sem expiração)
    async function loadArquivos() {
      const ids = G.messages.filter(m => String(m.content || '').trim() === '[arquivo]').map(m => m.id);
      if (!ids.length) return;
      try {
        const { data } = await getSB().from('chat_arquivos').select('*').in('message_id', ids);
        G.arquivos = G.arquivos || {};
        (data || []).forEach(a => { G.arquivos[a.message_id] = a; });
        renderMessages();
      } catch (e) {}
    }
    async function baixarArquivo(msgId) {
      const a = (G.arquivos || {})[msgId]; if (!a) return;
      const { data, error } = await getSB().storage.from('chat-arquivos').createSignedUrl(a.storage_path, 120, { download: a.nome });
      if (error || !data) { alert('Não foi possível baixar o arquivo.'); return; }
      window.open(data.signedUrl, '_blank');
    }

    function renderMessages() {
      const el = document.getElementById('messages');
      if (!G.messages.length) { el.innerHTML = `<div class="chat-empty">Nenhuma mensagem ainda.</div>`; return; }
      const uid = G.usuario.auth_id;
      let html = G.hasOlder ? `<div class="mais-antigas">${G.carregandoAntigas ? 'Carregando…' : 'Role para ver as mais antigas'}</div>` : '';
      let lastDate = '', lastSender = '', lastTs = 0, novasPosta = false;
      // última mensagem minha (para o "Visto")
      let ultimaMinha = null; for (let i = G.messages.length - 1; i >= 0; i--) { if (G.messages[i].sender_id === uid && !G.messages[i].deleted_at) { ultimaMinha = G.messages[i]; break; } }
      for (const m of G.messages) {
        const d = new Date(m.created_at), dk = d.toDateString();
        if (dk !== lastDate) { html += `<div class="date-sep">${fmtDateSep(d)}</div>`; lastDate = dk; lastSender = ''; }
        if (!novasPosta && G.lidoAte && m.created_at > G.lidoAte && m.sender_id !== uid) { html += `<div class="novas-sep">Novas mensagens</div>`; novasPosta = true; lastSender = ''; }
        const mem = G.membersByAuth[m.sender_id] || {};
        const sName = m.sender_name || mem.nome || '';
        const sIni = m.sender_iniciais || mem.iniciais || (sName || '??').substring(0,2).toUpperCase();
        const sCor = m.sender_cor || mem.cor || 'var(--verde)';
        if (m.deleted_at) {
          html += `<div class="sys-row"><div class="sys-pill">${m.sender_id === uid ? 'Você apagou uma mensagem' : escHtml(firstName(sName)) + ' apagou uma mensagem'}</div></div>`;
          lastSender = ''; continue;
        }
        if (isAnnot(m.content)) {
          html += `<div class="sys-row"><div class="sys-pill"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>${escHtml(firstName(sName))} anotou sobre um print</div></div>`;
          lastSender = ''; continue;
        }
        const own = m.sender_id === uid;
        const grouped = m.sender_id === lastSender && (d.getTime() - lastTs) < 15*60*1000;   // mesma regra do desktop
        lastSender = m.sender_id; lastTs = d.getTime();
        const media = G.media[m.id], onlyImg = isImageOnly(m.content) || isAudioOnly(m.content);
        let body = '';
        if (media || onlyImg) {
          if (media && media.objectUrl && media.audio) body += `<audio controls preload="none" src="${media.objectUrl}" style="width:230px;max-width:100%"></audio>`;
          else if (media && media.objectUrl) body += `<img class="bubble-img" src="${media.objectUrl}" loading="lazy" ${media.w && media.h ? `width="${media.w}" height="${media.h}"` : ''} onerror="imgFalhou('${m.id}')" onclick="openViewer(this.src)">`;
          else if (media && media.expired) body += `<div class="media-state">Imagem expirada</div>`;
          else if (media && media.failed) body += `<div class="media-state tocar" onclick="tentarMidia('${m.id}')">Não carregou · toque para tentar de novo</div>`;
          else body += `<div class="media-state">Carregando imagem…</div>`;
          if (!onlyImg && m.content) body += `<div class="bubble-cap">${fmtTexto(m.content)}</div>`;
        } else if (String(m.content || '').trim() === '[arquivo]') {
          const a = (G.arquivos || {})[m.id];
          body = a
            ? `<div class="media-state" onclick="baixarArquivo('${m.id}')" style="cursor:pointer">Arquivo: ${escHtml(a.nome)} · toque para baixar</div>`
            : `<div class="media-state">Carregando arquivo…</div>`;
        } else body = fmtTexto(m.content);
        if (m.reply_to) {
          const o = G.messages.find(x => String(x.id) === String(m.reply_to));
          const t = !o ? 'Mensagem anterior' : o.deleted_at ? 'Mensagem apagada' : previewOf(o.content);
          body = `<div class="quote">${o ? `<b>${escHtml(firstName(o.sender_name || ''))}</b> ` : ''}${escHtml(t)}</div>` + body;
        }
        // reações (curtir / amei), como no chat.js
        const rx = m.reactions && typeof m.reactions === 'object' ? m.reactions : {};
        const rxHtml = ['like', 'love'].map(k => {
          const arr = Array.isArray(rx[k]) ? rx[k] : [];
          if (!arr.length) return '';
          return `<button type="button" class="rx-chip${arr.indexOf(uid) !== -1 ? ' meu' : ''}" onclick="reagir('${m.id}','${k}')">${ICO[k]}${arr.length}</button>`;
        }).join('');
        const bcls = (media || onlyImg) ? 'bubble media-only' : 'bubble';
        const av = own ? '' : `<div class="msg-av" style="background:${sCor}">${escHtml(sIni)}</div>`;
        const ed = m.editado_em ? '<span class="msg-edit">editada</span>' : '';
        const head = own ? (m.editado_em ? `<div class="msg-head">${ed}</div>` : '') : `<div class="msg-head"><span class="msg-name">${escHtml(sName)}</span><span class="msg-time">${fmtTime(d)}</span>${ed}</div>`;
        const visto = own && ultimaMinha && ultimaMinha.id === m.id ? vistoHtml(m) : '';
        html += `<div class="msg ${own ? 'own' : ''} ${grouped ? 'grouped' : ''}" data-id="${m.id}">${av}<div class="msg-col">${head}<div class="${bcls}">${body}</div>${rxHtml ? `<div class="rx-row">${rxHtml}</div>` : ''}${visto}</div></div>`;
      }
      el.innerHTML = html;
    }
    function vistoHtml(m) {
      const nomes = (G.leituras || []).filter(r => r.user_id !== G.usuario.auth_id && r.last_read_at && r.last_read_at >= m.created_at)
        .map(r => firstName((G.membersByAuth[r.user_id] || {}).nome || '')).filter(Boolean);
      if (!nomes.length) return '';
      return `<div class="visto">Visto${G.channel && G.channel.startsWith('dm:') ? '' : ' por ' + escHtml(nomes.join(', '))}</div>`;
    }

    function upsertMessage(row) {
      const i = G.messages.findIndex(m => m.id === row.id);
      if (i === -1) { G.messages.push(row); G.messages.sort((a, b) => (a.created_at < b.created_at ? -1 : 1)); }
      else G.messages[i] = { ...G.messages[i], ...row };
    }

    async function markRead() {
      const sb = getSB(), now = new Date().toISOString();
      if (G.channelType === 'project') {
        await sb.from('chat_thread_reads').upsert({ user_auth_id: G.usuario.auth_id, thread_id: G.threadId, last_read_at: now }, { onConflict: 'user_auth_id,thread_id' });
      } else {
        await sb.from('chat_read_status').upsert({ user_id: G.usuario.auth_id, channel: G.channel, last_read_at: now }, { onConflict: 'user_id,channel' });
      }
    }

    async function sendText() {
      const input = document.getElementById('chat-input');
      const content = input.value.trim(); if (!content) return;
      fecharMencoes();
      if (G.editando) { const id = G.editando; cancelarBarra(true); input.value = ''; autoResize(input); return salvarEdicao(id, content); }
      const replyId = G.respondendo || null;
      input.value = ''; autoResize(input); cancelarBarra(true);
      G.lidoAte = null;   // respondeu: a linha "Novas mensagens" some
      const sb = getSB(), u = G.usuario;
      if (G.channelType === 'project') {
        const pl = { thread_id: G.threadId, sender_auth_id: u.auth_id, content };
        if (replyId) pl.reply_to = replyId;
        let r = await sb.from('chat_thread_messages').insert(pl).select('*').single();
        if (r.error && pl.reply_to && /reply_to/.test(r.error.message || '')) { delete pl.reply_to; r = await sb.from('chat_thread_messages').insert(pl).select('*').single(); }
        if (r.error) { input.value = content; showToast('Erro ao enviar', 'error'); return; }
        const row = normProj(r.data); row.sender_name = row.sender_name || u.nome; row.sender_iniciais = row.sender_iniciais || u.iniciais; row.sender_cor = row.sender_cor || u.cor;
        upsertMessage(row);
      } else {
        const pl = { channel: G.channel, sender_id: u.auth_id, sender_name: u.nome, sender_iniciais: u.iniciais || (u.nome || '').substring(0,2).toUpperCase(), sender_cor: u.cor || '#4D865C', content };
        if (replyId) pl.reply_to = replyId;
        let r = await sb.from('chat_messages').insert(pl).select('*').single();
        if (r.error && pl.reply_to && /reply_to/.test(r.error.message || '')) { delete pl.reply_to; r = await sb.from('chat_messages').insert(pl).select('*').single(); }
        if (r.error) { input.value = content; showToast('Erro ao enviar', 'error'); return; }
        upsertMessage(r.data);
      }
      renderMessages(); scrollBottom(true);
    }

    /* ── Etapa 2 (17/11/2026): segurar o dedo na mensagem abre as ações ── */
    let _segurar = null;
    function setupSegurar() {
      const box = document.getElementById('messages');
      box.addEventListener('touchstart', e => {
        const msg = e.target.closest('.msg'); if (!msg || e.target.closest('a,button,audio')) return;
        const t = e.touches[0];
        _segurar = { msg, x: t.clientX, y: t.clientY, timer: setTimeout(() => { msg.classList.add('segurando'); if (navigator.vibrate) try { navigator.vibrate(12); } catch (_) {} abrirAcoes(msg.dataset.id); _segurar = null; setTimeout(() => msg.classList.remove('segurando'), 200); }, 450) };
      }, { passive: true });
      const cancelar = () => { if (_segurar) { clearTimeout(_segurar.timer); _segurar = null; } };
      box.addEventListener('touchmove', e => { if (!_segurar) return; const t = e.touches[0]; if (Math.abs(t.clientX - _segurar.x) > 10 || Math.abs(t.clientY - _segurar.y) > 10) cancelar(); }, { passive: true });
      box.addEventListener('touchend', cancelar);
      box.addEventListener('touchcancel', cancelar);
      box.addEventListener('contextmenu', e => { if (e.target.closest('.msg')) e.preventDefault(); });
      // carrega as mais antigas ao chegar perto do topo
      box.addEventListener('scroll', () => { if (box.scrollTop < 80 && Date.now() > _ancoraAte) carregarAntigas(); }, { passive: true });
      box.addEventListener('touchstart', () => { _ancoraAte = 0; }, { passive: true });   // o dedo manda: para de reancorar
      // imagens mudam a altura: mantém a âncora enquanto abre
      box.addEventListener('load', e => { if (e.target && e.target.tagName === 'IMG') reancorar(); }, true);
    }
    function abrirAcoes(id) {
      const m = G.messages.find(x => String(x.id) === String(id)); if (!m || m.deleted_at) return;
      G.acaoId = m.id;
      const uid = G.usuario.auth_id, own = m.sender_id === uid;
      const rx = m.reactions && typeof m.reactions === 'object' ? m.reactions : {};
      document.getElementById('acoes-prev').textContent = (own ? 'Você' : firstName(m.sender_name || '')) + ': ' + previewOf(m.content);
      document.getElementById('acoes-rx').innerHTML = ['like', 'love'].map(k =>
        `<button type="button" class="${(rx[k] || []).indexOf(uid) !== -1 ? 'meu' : ''}" aria-label="${k === 'like' ? 'Curtir' : 'Amei'}" onclick="closeSheet('acoes');reagir('${m.id}','${k}')">${ICO[k]}</button>`).join('');
      const texto = !isImageOnly(m.content) && !isAudioOnly(m.content) && String(m.content || '').trim() !== '[arquivo]';
      const itens = [`<button type="button" class="acao-it" onclick="closeSheet('acoes');responder('${m.id}')">${ICO.reply}Responder</button>`];
      if (texto) itens.push(`<button type="button" class="acao-it" onclick="closeSheet('acoes');copiarMsg('${m.id}')">${ICO.copy}Copiar texto</button>`);
      if (own && texto) itens.push(`<button type="button" class="acao-it" onclick="closeSheet('acoes');editar('${m.id}')">${ICO.edit}Editar</button>`);
      if (own && G.channelType !== 'project') itens.push(`<button type="button" class="acao-it perigo" onclick="closeSheet('acoes');apagar('${m.id}')">${ICO.del}Apagar</button>`);
      document.getElementById('acoes-lista').innerHTML = itens.join('');
      openSheet('acoes');
    }
    function mostrarBarra(rotulo, texto) {
      document.getElementById('cb-lb').textContent = rotulo;
      document.getElementById('cb-txt').textContent = texto;
      document.getElementById('compose-bar').classList.add('show');
    }
    function cancelarBarra(silencioso) {
      const editava = !!G.editando;
      G.respondendo = null; G.editando = null;
      const b = document.getElementById('compose-bar'); if (b) b.classList.remove('show');
      if (editava && !silencioso) { const i = document.getElementById('chat-input'); i.value = ''; autoResize(i); }
    }
    function responder(id) {
      const m = G.messages.find(x => String(x.id) === String(id)); if (!m) return;
      G.editando = null; G.respondendo = m.id;
      mostrarBarra('Respondendo a ' + firstName(m.sender_name || ''), previewOf(m.content));
      document.getElementById('chat-input').focus();
    }
    function editar(id) {
      const m = G.messages.find(x => String(x.id) === String(id)); if (!m) return;
      G.respondendo = null; G.editando = m.id;
      mostrarBarra('Editando mensagem', previewOf(m.content));
      const i = document.getElementById('chat-input'); i.value = m.content || ''; autoResize(i); i.focus();
    }
    async function salvarEdicao(id, novo) {
      const m = G.messages.find(x => String(x.id) === String(id)); if (!m || novo === m.content) return;
      const antes = m.content, antesEd = m.editado_em || null;
      m.content = novo; m.editado_em = new Date().toISOString(); renderMessages();
      const proj = G.channelType === 'project';
      const r = await getSB().rpc(proj ? 'chat_thread_edit_message' : 'chat_edit_message', { p_message_id: id, p_content: novo });
      if (r.error) { m.content = antes; m.editado_em = antesEd; renderMessages(); showToast('Não foi possível editar', 'error'); return; }
      const up = Array.isArray(r.data) ? r.data[0] : r.data;
      if (up && up.id) { upsertMessage(proj ? normProj(up) : up); renderMessages(); }
    }
    async function apagar(id) {
      const m = G.messages.find(x => String(x.id) === String(id)); if (!m) return;
      if (!window.confirm('Apagar esta mensagem? Ela some da conversa para todos.')) return;
      const antes = m.deleted_at || null;
      m.deleted_at = new Date().toISOString(); renderMessages();
      const r = await getSB().rpc('chat_delete_message', { p_message_id: m.id });
      if (r.error) { m.deleted_at = antes; renderMessages(); showToast('Não foi possível apagar', 'error'); return; }
      const up = Array.isArray(r.data) ? r.data[0] : r.data;
      if (up && up.id) { upsertMessage(up); renderMessages(); }
    }
    async function copiarMsg(id) {
      const m = G.messages.find(x => String(x.id) === String(id)); if (!m) return;
      try { await navigator.clipboard.writeText(m.content || ''); showToast('Texto copiado', 'success'); } catch (_) { showToast('Não foi possível copiar', 'error'); }
    }
    const _rxTrava = {};
    async function reagir(id, tipo) {
      const m = G.messages.find(x => String(x.id) === String(id)); if (!m) return;
      const chave = id + '|' + tipo; if (_rxTrava[chave]) return;
      const uid = G.usuario.auth_id;
      const antes = m.reactions && typeof m.reactions === 'object' ? m.reactions : {};
      const arr = (Array.isArray(antes[tipo]) ? antes[tipo] : []).slice();
      const i = arr.indexOf(uid); if (i === -1) arr.push(uid); else arr.splice(i, 1);
      m.reactions = { ...antes, [tipo]: arr }; renderMessages();
      _rxTrava[chave] = true;
      const proj = G.channelType === 'project';
      const r = await getSB().rpc(proj ? 'chat_thread_toggle_reaction' : 'chat_toggle_reaction', { p_message_id: id, p_reaction: tipo });
      _rxTrava[chave] = false;
      if (r.error) { m.reactions = antes; renderMessages(); showToast('Não foi possível reagir', 'error'); return; }
      const up = Array.isArray(r.data) ? r.data[0] : r.data;
      if (up && up.id) { upsertMessage(proj ? normProj(up) : up); renderMessages(); }
    }

    /* ── Menções: @ + início do nome ou do sobrenome, sem acento ── */
    function aoDigitar(ta) {
      enviarDigitando();
      const pos = ta.selectionStart, antes = ta.value.slice(0, pos);
      const mm = antes.match(/(^|\s)@([^\s@]{0,30})$/);
      if (!mm) { fecharMencoes(); return; }
      G.mencaoPos = pos - mm[2].length - 1;
      const lista = (G.members || []).filter(m => m.auth_id && m.auth_id !== G.usuario.auth_id && m.nome && iniciaNome(m.nome, mm[2]))
        .sort((a, b) => (semAc(a.nome).indexOf(semAc(mm[2])) === 0 ? 0 : 1) - (semAc(b.nome).indexOf(semAc(mm[2])) === 0 ? 0 : 1) || a.nome.localeCompare(b.nome))
        .slice(0, 8);
      const dd = document.getElementById('mencao-dd');
      if (!lista.length) { fecharMencoes(); return; }
      dd.innerHTML = lista.map(m => `<div class="mencao-it" data-nome="${escHtml(m.nome)}"><span class="mencao-av" style="background:${m.cor || 'var(--verde)'}">${escHtml((m.iniciais || m.nome.substring(0, 2)).toUpperCase())}</span>${escHtml(m.nome)}</div>`).join('');
      dd.querySelectorAll('.mencao-it').forEach(it => it.addEventListener('pointerdown', e => { e.preventDefault(); escolherMencao(it.getAttribute('data-nome')); }));

    /* ── Digitando… (mesmo canal do chat.js: exp:typing:<conversa>) ── */
    let _digCh = null, _digUsers = {}, _digEnviado = 0, _digTimer = null;
    function entrarDigitando(ch) {
      if (_digCh) { try { getSB().removeChannel(_digCh); } catch (_) {} _digCh = null; }

        .on('broadcast', { event: 'typing' }, msg => {

          _digUsers[p.uid] = { nome: p.nome, ate: Date.now() + 4000 }; pintarDigitando();

    function enviarDigitando() {

    function pintarDigitando() {
